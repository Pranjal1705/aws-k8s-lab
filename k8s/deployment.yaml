apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-nginx
  labels:
    app: lab-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-nginx
  template:
    metadata:
      labels:
        app: lab-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-nginx-svc
spec:
  type: NodePort
  selector:
    app: lab-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
